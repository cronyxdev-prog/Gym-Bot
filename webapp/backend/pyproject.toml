[project]
name = "backend"
version = "0.1.0"
description = "Gym Bot Api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "litestar>=2.21.1",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
